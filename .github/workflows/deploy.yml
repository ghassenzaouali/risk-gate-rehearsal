name: deploy

# Test every push to main and every pull request; deploy only pushes to main
on:
  push:
    branches: [main]
  pull_request:

# Read the code, publish images, and get an OIDC token for Azure
permissions:
  contents: read
  packages: write
  id-token: write

# Image name on GitHub Container Registry (must be lowercase)
env:
  IMAGE: ghcr.io/ghassenzaouali/risk-gate-rehearsal

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # Deploy only pushes to main, after the tests pass, one deployment at a time
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v7

      # Log in to ghcr.io with the temporary token GitHub creates for each run
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image and push it, tagged with the commit id
      - name: Build and push the image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      # Log in to Azure with OIDC: no password is stored anywhere
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Deploy the new image and record its version (APP_VERSION = commit id)
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update --name risk-gate --resource-group rg-risk-gate \
            --image ${{ env.IMAGE }}:${{ github.sha }} --set-env-vars APP_VERSION=${{ github.sha }}

      # Smoke test: the new version must answer on /health (retries cover the cold start)
      - name: Smoke test
        run: |
          FQDN=$(az containerapp show --name risk-gate --resource-group rg-risk-gate \
            --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors "https://$FQDN/health"
